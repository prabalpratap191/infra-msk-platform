# ============================================================================
# Spring Boot Kafka Configuration
# ============================================================================

spring:
  application:
    name: customer-service
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-bootstrap.internal:9092}
    
    # Producer Configuration
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      compression-type: snappy
      batch-size: 32768
      linger-ms: 10
      buffer-memory: 33554432
      max-in-flight-requests-per-connection: 5
      
      # Idempotence for exactly-once semantics
      enable-idempotence: true
      
      properties:
        max.request.size: 1048576
        request.timeout.ms: 30000
        delivery.timeout.ms: 120000
    
    # Consumer Configuration
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: ${spring.application.name}-consumer-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
      fetch-min-size: 1024
      fetch-max-wait-ms: 500
      
      properties:
        session.timeout.ms: 30000
        heartbeat.interval.ms: 3000
        max.poll.interval.ms: 300000
        spring.json.trusted.packages: "*"
    
    # Listener Configuration
    listener:
      ack-mode: manual
      concurrency: 3
      poll-timeout: 3000
      
    # Admin Configuration
    admin:
      properties:
        request.timeout.ms: 30000
    
    # Common Properties
    properties:
      security.protocol: PLAINTEXT
      reconnect.backoff.ms: 1000
      reconnect.backoff.max.ms: 10000
      retry.backoff.ms: 1000

# Topic Configuration
kafka:
  topics:
    customer-events: ${KAFKA_TOPIC_CUSTOMER:customer-events}
    order-events: ${KAFKA_TOPIC_ORDER:order-events}
    catalog-events: ${KAFKA_TOPIC_CATALOG:catalog-events}
    payment-events: ${KAFKA_TOPIC_PAYMENT:payment-events}
    notification-events: ${KAFKA_TOPIC_NOTIFICATION:notification-events}
    dead-letter-events: ${KAFKA_TOPIC_DLQ:dead-letter-events}
    audit-events: ${KAFKA_TOPIC_AUDIT:audit-events}

# Logging
logging:
  level:
    org.apache.kafka: INFO
    org.springframework.kafka: INFO
    com.meracommerce: DEBUG
