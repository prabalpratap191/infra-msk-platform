# ============================================================================
# Helm Values for Spring Boot Microservice with Kafka
# ============================================================================

replicaCount: 3

image:
  repository: meracommerce/customer-service
  pullPolicy: IfNotPresent
  tag: "1.0.0"

serviceAccount:
  create: true
  name: customer-service-sa

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Kafka Configuration
kafka:
  enabled: true
  bootstrapServers: kafka-bootstrap.internal:9092
  topics:
    customer: customer-events
    order: order-events
    catalog: catalog-events
    payment: payment-events
    notification: notification-events
    deadLetter: dead-letter-events
    audit: audit-events

# Environment Variables
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  
  - name: KAFKA_BOOTSTRAP_SERVERS
    valueFrom:
      configMapKeyRef:
        name: kafka-config
        key: bootstrap.servers
  
  - name: KAFKA_TOPIC_CUSTOMER
    valueFrom:
      configMapKeyRef:
        name: kafka-config
        key: topics.customer-events
  
  - name: KAFKA_TOPIC_DLQ
    valueFrom:
      configMapKeyRef:
        name: kafka-config
        key: topics.dead-letter-events
  
  - name: JAVA_OPTS
    value: "-Xms512m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"

# Health Checks
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Volumes
volumes: []

volumeMounts: []

# Pod Annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/actuator/prometheus"

# Pod Labels
podLabels:
  app: customer-service
  tier: backend
  component: microservice

# Node Selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - customer-service
          topologyKey: kubernetes.io/hostname
