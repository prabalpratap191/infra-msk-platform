# ============================================================================
# Kafka Secret for EKS Integration
# Note: This is for PLAINTEXT setup. Update for SASL/SSL in production.
# ============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: kafka-secret
  namespace: default
type: Opaque
stringData:
  # For future SASL authentication
  kafka.username: ""
  kafka.password: ""
  
  # For future SSL/TLS
  kafka.truststore: ""
  kafka.keystore: ""
  kafka.keystore.password: ""
  
  # Current setup (PLAINTEXT)
  kafka.security.protocol: "PLAINTEXT"

---
# Namespace-specific secrets
apiVersion: v1
kind: Secret
metadata:
  name: kafka-secret
  namespace: customer-service-ns
type: Opaque
stringData:
  kafka.security.protocol: "PLAINTEXT"

